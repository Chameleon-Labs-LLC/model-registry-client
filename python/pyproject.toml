[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chameleonlabs-model-registry"
version = "0.2.0"
description = "Resolve current LLM model IDs (Anthropic/OpenAI/Gemini) from the ChameleonLabs public model registry — or your own."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chameleon Labs LLC" }]
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/Chameleon-Labs-LLC/model-registry-client"

[tool.setuptools.packages.find]
where = ["src"]
